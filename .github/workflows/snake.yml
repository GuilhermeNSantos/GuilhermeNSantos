name: Generate Pacman Graph

on:
  # Executa a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite executar manualmente
  workflow_dispatch:
  # Executa em todo push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Gera o gráfico de contribuição no estilo Pac-Man Amarelo
      - name: Generate Pacman SVG
        uses: jayceagripino/pacman-contribution-graph@main
        with:
          github_user_name: GuilhermeNSantos

      # Publica a imagem gerada na branch 'output'
      - name: Push Pacman SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
